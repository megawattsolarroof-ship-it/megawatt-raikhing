<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ลงทะเบียนใบหน้า</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#06151D">
  <script src="js/api-config.js"></script>
  <script src="js/face-support.js?v=20260928-r2"></script>
  <style>
    :root {
      --bg: #06151D;
      --surface: #0B222E;
      --surface-2: #0E2B36;
      --border: #144A46;
      --border-strong: #1E6B65;
      --accent: #4AF2D7;
      --accent-2: #3DE0C6;
      --text: #D1F7F2;
      --muted: #86ABA6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Prompt', sans-serif;
      min-height: 100vh;
      background: var(--bg);
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(74, 242, 215, 0.10), transparent 60%),
        radial-gradient(ellipse 60% 40% at 90% 110%, rgba(30, 107, 101, 0.18), transparent 60%);
      background-attachment: fixed;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 16px 60px;
    }

    .container {
      width: 100%;
      max-width: 520px;
      animation: fadeIn 0.5s ease;
    }

    /* Header */
    .page-header {
      text-align: center;
      margin-bottom: 24px;
    }
    .back-btn {
      display: inline-flex; align-items: center; gap: 6px;
      color: var(--muted); text-decoration: none; font-size: 0.9em; font-weight: 600;
      padding: 8px 16px; border-radius: 50px;
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.3);
      transition: all 0.25s ease;
      margin-bottom: 16px;
    }
    .back-btn:hover { color: var(--accent); background: var(--surface-2); border-color: var(--border-strong); transform: translateY(-1px); }

    h2 {
      font-size: 1.5em; font-weight: 700;
      background: linear-gradient(180deg, #FFFFFF 0%, #D1F7F2 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }
    .instruction {
      font-size: 0.85em; color: var(--muted); line-height: 1.6; font-weight: 400;
    }

    /* Step dots */
    .step-dots {
      display: flex; justify-content: center; gap: 10px;
      margin: 16px 0 20px;
    }
    .dot {
      width: 12px; height: 12px; border-radius: 50%;
      background: var(--border);
      transition: all 0.3s ease;
    }
    .dot.active {
      background: var(--accent);
      box-shadow: 0 0 12px rgba(74, 242, 215, 0.7);
    }

    /* Status */
    #status {
      font-size: 0.9em; color: var(--muted); font-weight: 600;
      margin-bottom: 14px; min-height: 20px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    /* Video */
    .video-wrapper {
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      border: 2px solid var(--border-strong);
      box-shadow: 0 0 25px -5px rgba(74, 242, 215, 0.3), 0 4px 20px -2px rgba(0, 0, 0, 0.5);
      background: #000000;
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
    }
    video {
      width: 100%; display: block;
      transform: scaleX(-1);
      border-radius: 16px;
    }

    /* Form Section */
    .form-section {
      margin-top: 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.35);
    }
    .name-section {
      margin-top: 0;
      margin-bottom: 16px;
      padding: 18px;
    }
    .name-section .input-group { margin-bottom: 0; }

    .input-group {
      position: relative;
      margin-bottom: 16px;
    }
    .input-group input {
      width: 100%;
      padding: 14px 16px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      color: var(--text);
      font-size: 14px;
      font-weight: 500;
      font-family: 'Prompt', sans-serif;
      outline: none;
      transition: all 0.3s ease;
    }
    .input-group input::placeholder { color: #3D5A57; font-weight: 400; }
    .input-group input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(74, 242, 215, 0.15);
    }

    #btnSave {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #4AF2D7 0%, #3DE0C6 100%);
      color: #06151D;
      border: none;
      border-radius: 16px;
      font-size: 15px;
      font-weight: 700;
      font-family: 'Prompt', sans-serif;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: all 0.3s ease;
      box-shadow: 0 0 18px rgba(74, 242, 215, 0.3);
    }
    #btnSave:hover:not(:disabled) {
      background: linear-gradient(135deg, #6FF7E2 0%, #4AF2D7 100%);
      transform: translateY(-2px);
      box-shadow: 0 0 28px rgba(74, 242, 215, 0.5);
    }
    #btnSave:disabled {
      background: var(--surface-2);
      color: #3D5A57;
      box-shadow: none;
      cursor: not-allowed;
    }

    .count-badge {
      background: rgba(6, 21, 29, 0.25);
      padding: 2px 10px;
      border-radius: 20px;
      font-size: 13px;
    }
    #btnSave:disabled .count-badge { background: var(--border); color: var(--muted); }

    #msg {
      margin-top: 16px; min-height: 24px;
      font-size: 0.9em; font-weight: 600;
      text-align: center;
    }
    .msg-success { color: #4AF2D7; }
    .msg-error   { color: #ff6b6b; }

    /* Animations */
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes spin   { to { transform: rotate(360deg); } }
    #btnCamera {
      background: var(--accent); color: var(--bg); border: 0; border-radius: 16px;
      padding: 14px 24px; margin: 12px 0; font: inherit; font-weight: 600; cursor: pointer;
    }
    #btnCamera:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }
  </style>
  <link rel="stylesheet" href="css/attendance-design.css?v=20260928-1">
</head>
<body class="aio-design aio-register">
<div class="container">
  <div class="page-header">
    <a href="index.html" class="back-btn">← กลับหน้าหลัก</a>
    <h2>👤 ลงทะเบียนใบหน้า</h2>
    <p class="instruction">กดเริ่มเพียงครั้งเดียว แล้วค่อย ๆ หันหน้าไปด้านหนึ่งและหมุนกลับไปอีกด้าน<br>ระบบจะเก็บใบหน้าให้อัตโนมัติ</p>
  </div>

  <div class="form-section name-section">
    <div class="input-group">
      <input type="text" id="username" placeholder="ชื่อ-นามสกุลพนักงาน">
    </div>
  </div>

  <div class="step-dots">
    <div class="dot" id="dot1"></div>
    <div class="dot" id="dot2"></div>
    <div class="dot" id="dot3"></div>
  </div>

  <div id="status" role="status" aria-live="polite">
    <span class="spinner"></span> กำลังโหลด AI Model...
  </div>

  <button type="button" id="btnCamera" hidden>📷 เปิดกล้อง</button>

  <div class="video-wrapper">
    <video id="video" autoplay muted playsinline></video>
  </div>

  <div class="form-section">
    <button id="btnSave" onclick="startAutoCapture()" disabled>
      🎥 เริ่มสแกนใบหน้า
    </button>

    <div id="msg"></div>
  </div>
</div>

<script>
  const API_URL   = localStorage.getItem('gasApiUrl') || GAS_API_URL;
  const APP_KEY   = localStorage.getItem('appKey') || '';
  const video     = document.getElementById('video');
  const statusDiv = document.getElementById('status');
  const btnSave   = document.getElementById('btnSave');
  const msgDiv    = document.getElementById('msg');
  let saveCounter = 0;
  let isCapturing = false;
  let knownFaces  = [];   // ใบหน้าที่ลงทะเบียนแล้ว — ใช้เช็กว่าหน้าใหม่คล้ายคนอื่นเกินไปหรือไม่

  // ระยะห่างขั้นต่ำจากใบหน้า "คนอื่น" — ถ้าใกล้กว่านี้ เสี่ยงสแกนแล้วชื่อสลับกัน
  const DUPLICATE_DISTANCE = 0.42;

  let modelsReady = false;
  let initBusy = false;
  let captureGeneration = 0;
  let savingRegistration = false;
  let registrationComplete = false;
  const btnCamera = document.getElementById('btnCamera');
  const camera = FaceSupport.createCamera(video, registrationCameraError);

  function registrationCameraError(message, preserveStream = false) {
    if (!preserveStream) camera.stop();
    if (savingRegistration || registrationComplete) return;
    captureGeneration++;
    isCapturing = false;
    saveCounter = 0;
    updateDots();
    btnSave.disabled = true;
    btnSave.textContent = '🎥 เริ่มสแกนใบหน้า';
    statusDiv.textContent = '❌ ' + message;
    statusDiv.style.color = '#ff6b6b';
    btnCamera.textContent = '📷 เปิดกล้องใหม่';
    btnCamera.onclick = startCamera;
    btnCamera.hidden = false;
    btnCamera.disabled = false;
  }

  if (!API_URL) {
    statusDiv.innerHTML = '<span style="color:#ff6b6b">❌ ยังไม่ได้ตั้งค่า API URL — <a href="config.html" style="color:#fbbf24">ไปตั้งค่า</a></span>';
  } else {
    window.addEventListener('load', initModels);
  }

  function updateDots() {
    [1,2,3].forEach(i => {
      const dot = document.getElementById('dot' + i);
      dot.className = 'dot' + (i <= saveCounter ? ' active' : '');
    });
  }

  async function initModels() {
    if (initBusy) return;
    initBusy = true;
    btnCamera.hidden = true;
    btnSave.disabled = true;
    statusDiv.textContent = 'กำลังโหลดระบบสแกน...';
    statusDiv.style.color = 'var(--text)';
    try {
      await FaceSupport.loadModels();
      statusDiv.textContent = 'กำลังโหลดข้อมูลพนักงาน...';
      await loadKnownFaces();
      modelsReady = true;
      // Explicit tap also supports browsers that require a playback gesture.
      statusDiv.textContent = 'ระบบพร้อม กรุณาแตะเปิดกล้อง';
      btnCamera.textContent = '📷 เปิดกล้อง';
      btnCamera.onclick = startCamera;
      btnCamera.disabled = false;
      btnCamera.hidden = false;
    } catch (error) {
      statusDiv.textContent = '❌ เตรียมระบบไม่สำเร็จ: ' + error.message;
      statusDiv.style.color = '#ff6b6b';
      btnCamera.textContent = '↻ ลองเตรียมระบบใหม่';
      btnCamera.onclick = initModels;
      btnCamera.disabled = false;
      btnCamera.hidden = false;
    } finally {
      initBusy = false;
    }
  }

  async function loadKnownFaces() {
    const data = await FaceSupport.fetchJSON(API_URL + '?action=getKnownFaces&site=' + encodeURIComponent(APP_SITE) + '&key=' + encodeURIComponent(APP_KEY));
    if (!Array.isArray(data)) throw new Error('ข้อมูลพนักงานไม่ถูกต้อง กรุณาลองใหม่');
    knownFaces = data.map(u => ({ name: u.label, descriptor: new Float32Array(u.descriptor) }));
  }

  async function startCamera() {
    if (!modelsReady || isCapturing || savingRegistration || registrationComplete) return;
    btnCamera.hidden = true;
    btnSave.disabled = true;
    statusDiv.textContent = 'กำลังเปิดกล้อง รอภาพจากกล้อง...';
    statusDiv.style.color = 'var(--text)';
    if (!(await camera.start())) return;
    statusDiv.textContent = 'กล้องพร้อม กรุณากรอกชื่อแล้วเริ่มสแกนใบหน้า';
    btnSave.disabled = false;
  }

  const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

  function faceTurn(detection) {
    const jaw = detection.landmarks.getJawOutline();
    const nose = detection.landmarks.getNose();
    const faceWidth = Math.max(1, jaw[16].x - jaw[0].x);
    const faceCenter = (jaw[0].x + jaw[16].x) / 2;
    return (nose[3].x - faceCenter) / faceWidth;
  }

  async function detectGoodFace(run) {
    const detection = await FaceSupport.detect(video, () => run === captureGeneration && isCapturing && camera.isReady());
    if (run !== captureGeneration || !camera.isReady()) throw new Error('กล้องหยุด กรุณาเปิดกล้องใหม่');
    return detection && detection.detection.score >= 0.7 ? detection : null;
  }

  async function capturePose(test, instruction, timeoutMs = 25000) {
    statusDiv.textContent = instruction;
    const started = Date.now();
    const run = captureGeneration;
    let stableFrames = 0;
    let latest = null;
    while (isCapturing && run === captureGeneration && Date.now() - started < timeoutMs) {
      const detection = await detectGoodFace(run);
      if (detection && test(faceTurn(detection))) {
        latest = detection;
        stableFrames++;
        if (stableFrames >= 2) return latest;
      } else {
        stableFrames = 0;
      }
      await wait(250);
    }
    throw new Error('ใช้เวลานานเกินไป กรุณาอยู่ในที่สว่างและหันหน้าช้า ๆ แล้วลองใหม่');
  }

  async function startAutoCapture() {
    const name = document.getElementById('username').value.trim();
    if (!name) return alert('กรุณาใส่ชื่อก่อน');
    if (isCapturing || savingRegistration || registrationComplete) return;
    if (!camera.isReady()) return registrationCameraError('กรุณาเปิดกล้องให้มีภาพก่อนสแกน');
    const run = ++captureGeneration;
    isCapturing = true;
    btnSave.disabled = true;
    btnSave.innerHTML = '⏳ กำลังสแกน...';
    msgDiv.innerText = '';
    try {
      const captures = [];
      const center = await capturePose(yaw => Math.abs(yaw) < 0.055, '① มองตรงที่กล้อง');
      captures.push(center);
      saveCounter = 1;
      updateDots();

      let closest = { name: '', distance: 1 };
      knownFaces.forEach(u => {
        if (u.name === name) return;
        const distance = faceapi.euclideanDistance(center.descriptor, u.descriptor);
        if (distance < closest.distance) closest = { name: u.name, distance };
      });
      if (closest.name && closest.distance < DUPLICATE_DISTANCE && !confirm(
        '⚠️ ใบหน้านี้คล้ายกับ "' + closest.name + '" ที่ลงทะเบียนไว้แล้วมาก\nยืนยันลงทะเบียนต่อหรือไม่?'
      )) throw new Error('ยกเลิกการลงทะเบียน');

      const firstSide = await capturePose(yaw => Math.abs(yaw) > 0.09, '② ค่อย ๆ หันหน้าไปด้านใดด้านหนึ่ง');
      const firstDirection = Math.sign(faceTurn(firstSide));
      captures.push(firstSide);
      saveCounter = 2;
      updateDots();

      const otherSide = await capturePose(
        yaw => Math.abs(yaw) > 0.09 && Math.sign(yaw) === -firstDirection,
        '③ หมุนหน้ากลับช้า ๆ ผ่านตรงกลาง ไปอีกด้านหนึ่ง'
      );
      captures.push(otherSide);
      saveCounter = 3;
      updateDots();
      if (run !== captureGeneration || !camera.isReady()) throw new Error('กล้องหยุด กรุณาเปิดกล้องใหม่');
      savingRegistration = true;
      statusDiv.textContent = 'กำลังบันทึกข้อมูล...';

      for (const capture of captures) {
        const res = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'registerUser', site: APP_SITE, key: APP_KEY, name, descriptor: Array.from(capture.descriptor) })
        });
        const data = await res.json();
        if (!(data.status === 'success' || data.success)) throw new Error(data.message || 'เกิดข้อผิดพลาดจากระบบหลังบ้าน');
      }

      statusDiv.textContent = '';
      msgDiv.innerHTML = '<span class="msg-success">🎉 ลงทะเบียนใบหน้าสำเร็จ!</span>';
      registrationComplete = true;
      camera.stop();
      btnSave.innerHTML = '✅ ลงทะเบียนเรียบร้อย';
      document.getElementById('username').disabled = true;
      isCapturing = false;
    } catch (e) {
      if (run !== captureGeneration) return;
      isCapturing = false;
      saveCounter = 0;
      updateDots();
      statusDiv.textContent = '';
      msgDiv.textContent = '❌ บันทึกล้มเหลว: ' + e.message;
      msgDiv.className = 'msg-error';
      btnSave.disabled = !camera.isReady();
      btnSave.innerHTML = '🎥 เริ่มสแกนใบหน้าใหม่';
      if (!camera.isReady()) {
        btnCamera.textContent = '📷 เปิดกล้องใหม่';
        btnCamera.onclick = startCamera;
        btnCamera.hidden = false;
      }
    } finally {
      if (run === captureGeneration) savingRegistration = false;
    }
  }
</script>
</body>
</html>
