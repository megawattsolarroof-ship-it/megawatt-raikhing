<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สแกนเข้า-ออกงาน</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#06151D">
  <script src="js/api-config.js"></script>
  <script src="js/face-support.js?v=20260928-r2"></script>
  <style>
    :root {
      --bg: #06151D;
      --surface: #0B222E;
      --surface-2: #0E2B36;
      --border: #144A46;
      --border-strong: #1E6B65;
      --accent: #4AF2D7;
      --accent-2: #3DE0C6;
      --text: #D1F7F2;
      --muted: #86ABA6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Prompt', sans-serif;
      min-height: 100vh;
      background: var(--bg);
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(74, 242, 215, 0.10), transparent 60%),
        radial-gradient(ellipse 60% 40% at 90% 110%, rgba(30, 107, 101, 0.18), transparent 60%);
      background-attachment: fixed;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 50px;
    }

    .page-wrap {
      width: 100%; max-width: 560px;
      animation: fadeIn 0.5s ease;
      display: flex; flex-direction: column; align-items: center;
    }

    /* Header */
    .top-bar {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: center;
      gap: 12px;
      width: 100%; margin-bottom: 20px;
    }
    .back-btn {
      display: inline-flex; align-items: center; gap: 6px;
      color: var(--muted); text-decoration: none; font-size: 0.88rem; font-weight: 600;
      padding: 10px 14px; border-radius: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.3);
      transition: all 0.25s ease;
      white-space: nowrap;
    }
    .back-btn:hover { color: var(--accent); background: var(--surface-2); border-color: var(--border-strong); }

    .scan-brand {
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 11px;
    }
    .scan-logo {
      width: 62px;
      height: 62px;
      flex: 0 0 62px;
      display: block;
      object-fit: cover;
      border-radius: 16px;
      border: 1px solid var(--border-strong);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
    }
    .scan-heading { min-width: 0; text-align: left; }
    .scan-kicker {
      display: block;
      margin-bottom: 2px;
      color: var(--muted);
      font-size: 0.68rem;
      font-weight: 500;
      line-height: 1.2;
      letter-spacing: 0.02em;
    }
    .scan-heading h2 {
      margin: 0;
      font-size: clamp(1rem, 4.6vw, 1.22rem);
      line-height: 1.25;
      font-weight: 700;
      background: linear-gradient(180deg, #FFFFFF 0%, #D1F7F2 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    @media (max-width: 380px) {
      .top-bar { gap: 9px; }
      .back-btn { padding: 9px 11px; font-size: 0.8rem; }
      .scan-brand { gap: 8px; }
      .scan-logo { width: 52px; height: 52px; flex-basis: 52px; border-radius: 14px; }
      .scan-kicker { font-size: 0.61rem; }
      .scan-heading h2 { font-size: 0.95rem; }
    }

    /* Status Area */
    .status-area {
      width: 100%; text-align: center; margin-bottom: 16px;
      background: var(--surface);
      padding: 16px;
      border-radius: 20px;
      box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.35);
      border: 1px solid var(--border);
    }
    #main-status {
      font-size: 0.95em; color: var(--text); font-weight: 600;
      min-height: 22px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    #gps-status {
      font-size: 0.85em; color: var(--muted); margin-top: 8px;
      min-height: 18px;
    }

    /* GPS Alert */
    .gps-alert {
      display: none;
      background: rgba(255, 107, 107, 0.08);
      border: 1px solid rgba(255, 107, 107, 0.35);
      color: #ff6b6b;
      border-radius: 16px; padding: 14px;
      width: 100%; margin-bottom: 16px;
      font-size: 0.9em; font-weight: 600;
      text-align: center;
    }

    /* Scanner Container */
    .video-container {
      position: relative;
      width: 100%;
      border-radius: 24px;
      overflow: hidden;
      background: #000000;
      border: 2px solid var(--border-strong);
      box-shadow: 0 0 30px -5px rgba(74, 242, 215, 0.3), 0 4px 25px -2px rgba(0, 0, 0, 0.5);
      min-height: 280px;
    }

    video {
      width: 100%; height: auto; display: block;
      transform: scaleX(-1);
      opacity: 0;
      transition: opacity 0.5s ease;
    }
    video.active { opacity: 1; }

    /* Scanner frame corners */
    .scanner-frame {
      position: absolute; inset: 0; z-index: 5; pointer-events: none;
    }
    .corner {
      position: absolute;
      width: 30px; height: 30px;
      border-color: var(--accent);
      border-style: solid;
      opacity: 0.9;
      filter: drop-shadow(0 0 6px rgba(74, 242, 215, 0.7));
    }
    .corner-tl { top: 16px;    left: 16px;   border-width: 4px 0 0 4px; border-radius: 6px 0 0 0; }
    .corner-tr { top: 16px;    right: 16px;  border-width: 4px 4px 0 0; border-radius: 0 6px 0 0; }
    .corner-bl { bottom: 16px; left: 16px;   border-width: 0 0 4px 4px; border-radius: 0 0 0 6px; }
    .corner-br { bottom: 16px; right: 16px;  border-width: 0 4px 4px 0; border-radius: 0 0 6px 0; }

    /* Scan line */
    .scan-line {
      display: none;
      position: absolute; left: 8%; right: 8%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #4AF2D7, transparent);
      box-shadow: 0 0 14px rgba(74, 242, 215, 0.9);
      z-index: 6;
      animation: scanMove 2s ease-in-out infinite;
    }
    .scan-line.active { display: block; }

    /* Overlay status badge */
    #overlay-status {
      position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(6, 21, 29, 0.85);
      backdrop-filter: blur(8px);
      color: var(--text);
      padding: 6px 20px; border-radius: 30px;
      z-index: 10; white-space: nowrap; font-size: 0.85em; font-weight: 700;
      box-shadow: 0 0 12px rgba(74, 242, 215, 0.25);
      border: 1px solid var(--border);
    }

    /* Start Button */
    #btnStart {
      display: none;
      background: linear-gradient(135deg, #4AF2D7 0%, #3DE0C6 100%);
      color: #06151D; border: none; border-radius: 50px;
      padding: 16px 44px; font-size: 16px; font-weight: 700;
      cursor: pointer; font-family: 'Prompt', sans-serif;
      box-shadow: 0 0 20px rgba(74, 242, 215, 0.35);
      margin: 20px auto 0;
      transition: all 0.3s ease;
      animation: btnPulse 2s ease-in-out infinite;
    }
    #btnStart:hover {
      background: linear-gradient(135deg, #6FF7E2 0%, #4AF2D7 100%);
      transform: translateY(-3px);
      box-shadow: 0 0 30px rgba(74, 242, 215, 0.55);
      animation: none;
    }

    /* ===== Modal ===== */
    .modal-overlay {
      display: none; position: fixed;
      inset: 0;
      background: rgba(6, 21, 29, 0.75);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 100;
      align-items: center; justify-content: center;
    }
    .modal-content {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 32px 28px;
      border-radius: 24px;
      width: 90%; max-width: 360px;
      text-align: center;
      box-shadow: 0 0 40px -5px rgba(74, 242, 215, 0.25), 0 20px 40px rgba(0, 0, 0, 0.5);
      display: flex; flex-direction: column; align-items: center;
      animation: modalSlideUp 0.35s ease;
    }
    .modal-avatar {
      font-size: 56px;
      background: rgba(74, 242, 215, 0.08);
      border: 3px solid var(--border-strong);
      border-radius: 50%;
      width: 86px; height: 86px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 16px;
      box-shadow: 0 0 20px rgba(74, 242, 215, 0.25);
    }
    .modal-title { font-size: 0.85em; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
    .user-name {
      font-size: 24px; font-weight: 700;
      background: linear-gradient(180deg, #FFFFFF 0%, #D1F7F2 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    .action-badge {
      padding: 6px 18px; border-radius: 30px;
      font-size: 14px; font-weight: 700;
      margin-bottom: 10px;
      background: rgba(74, 242, 215, 0.12);
      border: 1px solid rgba(74, 242, 215, 0.35);
      color: var(--accent);
    }
    .action-badge.out {
      background: rgba(251, 191, 36, 0.12);
      border-color: rgba(251, 191, 36, 0.4);
      color: #fbbf24;
    }
    .time-badge {
      background: rgba(74, 242, 215, 0.12);
      border: 1px solid rgba(74, 242, 215, 0.35);
      color: var(--accent);
      padding: 8px 22px; border-radius: 30px;
      font-size: 15px; font-weight: 700;
      margin-bottom: 8px;
    }
    .score-text { color: var(--muted); font-size: 13px; margin-bottom: 24px; }

    .btn {
      border: none; border-radius: 16px; cursor: pointer; width: 100%;
      margin: 6px 0; font-family: 'Prompt', sans-serif;
      transition: all 0.25s ease;
    }
    .btn-confirm {
      background: linear-gradient(135deg, #4AF2D7 0%, #3DE0C6 100%);
      color: #06151D;
      padding: 16px; font-size: 16px; font-weight: 700;
      box-shadow: 0 0 18px rgba(74, 242, 215, 0.35);
      margin-bottom: 10px;
    }
    .btn-confirm:hover:not(:disabled) {
      background: linear-gradient(135deg, #6FF7E2 0%, #4AF2D7 100%);
      box-shadow: 0 0 28px rgba(74, 242, 215, 0.55);
      transform: translateY(-2px);
    }
    .btn-confirm:disabled { background: var(--surface-2); color: #3D5A57; box-shadow: none; }

    .btn-cancel {
      background: transparent;
      border: 1px solid var(--border-strong);
      color: var(--muted);
      padding: 12px; font-size: 14px; font-weight: 600;
    }
    .btn-cancel:hover { background: var(--surface-2); color: #ff6b6b; border-color: rgba(255, 107, 107, 0.5); }

    /* Note Input & Close Btn */
    .close-modal-btn {
      position: absolute; top: 16px; right: 16px;
      background: var(--surface-2); border: 1px solid var(--border); color: var(--muted);
      width: 32px; height: 32px; border-radius: 50%;
      font-size: 16px; font-weight: bold;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.2s ease;
    }
    .close-modal-btn:hover { border-color: var(--accent); color: var(--accent); }

    .note-input {
      width: 100%; padding: 12px 16px;
      background: var(--bg); border: 1px solid var(--border); border-radius: 12px;
      color: var(--text); font-size: 14px; font-family: 'Prompt', sans-serif;
      outline: none; transition: all 0.3s ease;
      margin-bottom: 16px;
    }
    .note-input::placeholder { color: #3D5A57; }
    .note-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(74, 242, 215, 0.15);
    }

    /* Animations */
    @keyframes fadeIn      { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes btnPulse    { 0%,100% { box-shadow: 0 0 15px rgba(74, 242, 215, 0.3); } 50% { box-shadow: 0 0 30px rgba(74, 242, 215, 0.6); } }
    @keyframes scanMove    { 0% { top: 12%; } 50% { top: 82%; } 100% { top: 12%; } }
    @keyframes modalSlideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
  </style>

</head>
<body class="aio-design aio-scan">
<div class="page-wrap">

  <div class="top-bar">
    <a href="index.html" class="back-btn" aria-label="กลับหน้าหลัก">← หน้าหลัก</a>
    <div class="scan-brand">
      <img src="icons/icon-192.jpg" alt="MEGAwatt Solar" class="scan-logo">
      <div class="scan-heading">
        <span class="scan-kicker">ระบบลงเวลาทำงาน</span>
        <h2>สแกนเข้า–ออกงาน</h2>
      </div>
    </div>
  </div>

  <div class="status-area">
    <div id="main-status" role="status" aria-live="polite">⏳ กำลังเตรียมระบบ...</div>
    <div id="gps-status"></div>
  </div>

  <div id="gps-alert-box" class="gps-alert">
    ⚠️ คุณอยู่นอกพื้นที่ที่กำหนด!<br>กรุณาเข้าใกล้จุดสแกนแล้วรีเฟรชหน้าจอ
  </div>

  <button id="btnStart" onclick="startCamera()">📷 แตะเพื่อเริ่มสแกน</button>

  <div class="video-container">
    <div class="scanner-frame">
      <div class="corner corner-tl"></div>
      <div class="corner corner-tr"></div>
      <div class="corner corner-bl"></div>
      <div class="corner corner-br"></div>
      <div class="scan-line" id="scanLine"></div>
    </div>
    <div id="overlay-status">รอโหลด...</div>
    <video id="video" autoplay muted playsinline></video>
  </div>

</div>

<!-- Confirm Modal -->
<div id="confirmModal" class="modal-overlay">
  <div class="modal-content" style="position: relative;">
    <button class="close-modal-btn" onclick="cancelAttendance()">✕</button>
    <div class="modal-avatar">🙋</div>
    <p class="modal-title">ตรวจพบบุคคล</p>
    <div class="user-name" id="modalName">...</div>
    <div id="modalAction" class="action-badge">🟢 สแกนเข้างาน</div>
    <div id="modalTime" class="time-badge">00:00</div>
    <div id="modalScore" class="score-text"></div>

    <input type="text" id="noteInput" class="note-input" placeholder="ใส่หมายเหตุที่นี่ (ถ้ามี)...">

    <button class="btn btn-confirm" id="btnConfirm" onclick="confirmAttendance()">✅ ยืนยันบันทึกเวลา</button>
    <button class="btn btn-cancel" onclick="cancelAttendance()">ไม่ใช่ฉัน (สแกนใหม่)</button>
  </div>
</div>

<script src="js/attendance-recovery.js?v=20260928-r1"></script>
<script>
  const API_URL        = localStorage.getItem('gasApiUrl') || GAS_API_URL;
  const APP_KEY        = localStorage.getItem('appKey') || '';
  const video          = document.getElementById('video');
  const mainStatus     = document.getElementById('main-status');
  const overlayStatus  = document.getElementById('overlay-status');
  const confirmModal   = document.getElementById('confirmModal');
  const gpsStatus      = document.getElementById('gps-status');
  const gpsAlertBox    = document.getElementById('gps-alert-box');
  const btnStart       = document.getElementById('btnStart');

  // ===== เกณฑ์การจับคู่ใบหน้า =====
  // MATCH_THRESHOLD  : ระยะห่างสูงสุดที่ยอมรับว่า "ใช่คนนี้" (ยิ่งต่ำยิ่งเข้มงวด)
  // MATCH_MARGIN     : ต้องชนะคนอันดับ 2 อย่างน้อยเท่านี้ ถ้าใกล้เคียงกันเกินไปถือว่ากำกวม ไม่ตัดสิน
  // CONFIRM_FRAMES   : ต้องจับได้เป็นคนเดิมติดต่อกันกี่เฟรมจึงยืนยันตัวตน (กันเฟรมเบลอ/มุมเอียงจับผิดคน)
  // MIN_DETECT_SCORE : ความชัดของใบหน้าขั้นต่ำ เฟรมที่มัว/มืดจะถูกข้ามไม่นำมาตัดสิน
  const MATCH_THRESHOLD  = 0.42;
  const MATCH_MARGIN     = 0.05;
  const CONFIRM_FRAMES   = 3;
  const MIN_DETECT_SCORE = 0.6;

  let knownFaces    = [];
  let checkedInToday = {};   // ชื่อ → true ถ้าวันนี้มีเวลาเข้าแล้ว (สแกนถัดไป = ออกงาน)
  let scanInterval  = null;
  let currentMatch  = null;
  let currentLat    = null;
  let currentLng    = null;
  let currentAccuracy = 0;
  let confirmName   = null;
  let confirmCount  = 0;

  let todayStatusLoaded = false;
  let systemReady = false;
  let savingAttendance = false;
  let idempotentBackend = false;
  let configPromise = null;
  let scanDeadline = null;
  let initBusy = false;
  let scanGeneration = 0;
  const camera = FaceSupport.createCamera(video, cameraFailure);

  function stopScanLoop() {
    scanGeneration++;
    clearTimeout(scanDeadline);
    clearTimeout(scanInterval);
    scanInterval = null;
    confirmName = null;
    confirmCount = 0;
    document.getElementById('scanLine').classList.remove('active');
  }

  function cameraFailure(message, preserveStream = false) {
    stopScanLoop();
    if (!preserveStream) camera.stop();
    // A submitted attendance request owns its result; do not interrupt it.
    if (savingAttendance) return;
    confirmModal.style.display = 'none';
    currentMatch = null;
    showError(message);
  }

  if (!API_URL) {
    showError('ยังไม่ได้ตั้งค่า API URL');
  } else {
    window.addEventListener('load', init);
  }

  async function init() {
    if (initBusy) return;
    initBusy = true;
    systemReady = false;
    btnStart.style.display = 'none';
    gpsAlertBox.style.display = 'none';
    mainStatus.style.color = 'var(--text)';
    try {
      AttendanceRecovery.record('prepare');
      configPromise = FaceSupport.fetchJSON(API_URL + '?action=getConfig&scope=attendance&site=' + encodeURIComponent(APP_SITE) + '&key=' + encodeURIComponent(APP_KEY));
      configPromise.catch(() => {});
      const facesReady = loadFaceDatabase();
      facesReady.catch(() => {});
      mainStatus.innerText = '1/4 ตรวจสอบ GPS...';
      overlayStatus.innerText = 'กำลังตรวจตำแหน่ง';
      await checkGPS();
      mainStatus.innerText = '2/4 โหลด AI Model...';
      overlayStatus.innerText = 'กำลังโหลดระบบสแกน';
      await FaceSupport.loadModels();
      await facesReady;
      systemReady = true;
      AttendanceRecovery.record('ready');
      mainStatus.innerText = '✅ ระบบพร้อมใช้งาน';
      mainStatus.style.color = 'var(--accent)';
      overlayStatus.innerText = 'แตะปุ่มเพื่อเปิดกล้อง';
      btnStart.textContent = '📷 แตะเพื่อเริ่มสแกน';
      btnStart.onclick = startCamera;
      btnStart.disabled = false;
      btnStart.style.display = 'inline-block';
      void loadTodayStatus();
    } catch (error) {
      showError(error.message);
    } finally {
      initBusy = false;
    }
  }

  function checkGPS() {
    return new Promise((resolve, reject) => {
      if (!navigator.geolocation) {
        reject(new Error('Browser ไม่รองรับ GPS'));
        return;
      }
      getHighAccuracyPosition(
        async pos => {
          currentLat = pos.coords.latitude;
          currentLng = pos.coords.longitude;
          currentAccuracy = Number(pos.coords.accuracy) || 0;

          try {
            const config = await configPromise;
            idempotentBackend = config.attendanceProtocol === 1;

            if (config.error === 'unauthorized') {
              reject(new Error(config.message || 'App Key ไม่ถูกต้อง'));
              return;
            }

            if (!config.lat || !config.lng || config.radius == 0) {
              gpsStatus.textContent = '📍 GPS: ไม่จำกัดพื้นที่';
              gpsStatus.style.color = '#3DE0C6';
              gpsStatus.style.fontWeight = '600';
              resolve();
              return;
            }

            const dist = haversineKm(currentLat, currentLng, config.lat, config.lng);
            const accuracyAllowanceKm = Math.min(currentAccuracy, 50) / 1000;

            if (dist <= Number(config.radius) + accuracyAllowanceKm) {
              gpsStatus.textContent = '📍 GPS: OK (ห่างเป้าหมาย ' + dist.toFixed(3) + ' km)';
              gpsStatus.style.color = '#3DE0C6';
              gpsStatus.style.fontWeight = '600';
              resolve();
            } else {
              gpsStatus.textContent = '📍 GPS: ห่างเกินไป (' + dist.toFixed(3) + ' km / กำหนด ' + Number(config.radius || 0).toFixed(3) + ' km)';
              gpsStatus.style.color = '#ff6b6b';
              gpsStatus.style.fontWeight = '600';
              gpsAlertBox.style.display = 'block';
              mainStatus.innerText = '⛔ ไม่อนุญาตให้สแกน';
              overlayStatus.innerText = 'Out of Range';
              reject(new Error('คุณอยู่นอกพื้นที่ที่กำหนด กรุณาเข้าใกล้จุดสแกนแล้วลองใหม่'));
            }
          } catch (e) {
            reject(new Error('เชื่อมต่อ API ไม่ได้: ' + e.message));
          }
        },
        () => reject(new Error('กรุณาเปิด GPS (Location Service)'))
      );
    });
  }

  function getHighAccuracyPosition(success, error) {
    let bestPosition = null;
    let finished = false;
    let watchId = null;
    const finish = (position, geoError) => {
      if (finished) return;
      finished = true;
      if (watchId !== null) navigator.geolocation.clearWatch(watchId);
      clearTimeout(timerId);
      if (position) success(position);
      else error(geoError);
    };
    const timerId = setTimeout(() => finish(bestPosition, { code: 3 }), 7000);
    watchId = navigator.geolocation.watchPosition(position => {
      if (!bestPosition || position.coords.accuracy < bestPosition.coords.accuracy) bestPosition = position;
      if (position.coords.accuracy <= 50) finish(position);
    }, geoError => {
      if (geoError.code === 1) finish(null, geoError);
    }, {
      enableHighAccuracy: true,
      timeout: 7000,
      maximumAge: 0
    });
  }

  async function loadFaceDatabase() {
    mainStatus.innerText = '3/4 โหลดฐานข้อมูลพนักงาน...';
    overlayStatus.innerText = 'กำลังโหลดข้อมูลพนักงาน';
    const data = await FaceSupport.fetchJSON(API_URL + '?action=getKnownFaces&site=' + encodeURIComponent(APP_SITE) + '&key=' + encodeURIComponent(APP_KEY));
    if (!Array.isArray(data) || data.length === 0) throw new Error('ไม่พบข้อมูลพนักงาน กรุณาลงทะเบียนก่อน');
    knownFaces = data.map(u => ({ name: u.label, descriptor: new Float32Array(u.descriptor) }));
    
  }

  async function loadTodayStatus() {
    try {
      const rows = await FaceSupport.fetchJSON(API_URL + '?action=getTodayAttendance&site=' + encodeURIComponent(APP_SITE) + '&key=' + encodeURIComponent(APP_KEY));
      todayStatusLoaded = true;
      checkedInToday = {};
      if (Array.isArray(rows)) {
        rows.forEach(r => { if (r['ชื่อ']) checkedInToday[r['ชื่อ']] = true; });
      }
    } catch (e) { /* ดึงไม่ได้ก็สแกนได้ตามปกติ แค่ป้ายเข้า/ออกอาจไม่โชว์ */ }
  }

  async function startCamera() {
    if (!systemReady || savingAttendance) return;
    if (FaceSupport.requiresReload()) { location.reload(); return; }
    AttendanceRecovery.record('camera-start');
    stopScanLoop();
    btnStart.style.display = 'none';
    mainStatus.innerText = 'กำลังเปิดกล้อง...';
    mainStatus.style.color = 'var(--text)';
    overlayStatus.innerText = 'รอภาพจากกล้อง';
    if (!(await camera.start())) return;
    mainStatus.innerText = '✅ กำลังสแกน...';
    mainStatus.style.color = 'var(--accent)';
    startScanLoop();
  }

  function startScanLoop() {
    stopScanLoop();
    document.getElementById('scanLine').classList.add('active');
    confirmName  = null;
    confirmCount = 0;
    overlayStatus.innerText      = 'มองกล้องเพื่อสแกน';
    overlayStatus.style.background = 'rgba(6,21,29,0.85)';
    overlayStatus.style.color = '#D1F7F2';
    overlayStatus.style.border = '1px solid #144A46';

    scanDeadline = setTimeout(() => cameraFailure('ยังยืนยันใบหน้าไม่ได้ภายใน 30 วินาที กรุณาอยู่ในที่สว่าง มองกล้องตรง ๆ แล้วลองใหม่ หรือแจ้งผู้ดูแล'), 30000);
    const run = scanGeneration;
    const isCurrent = () => run === scanGeneration && camera.isReady();
    const tick = async () => {
      if (!isCurrent()) return;
      try {

        const detection = await FaceSupport.detect(video, isCurrent);
        if (!isCurrent()) return;

        // ไม่เจอหน้า หรือเฟรมไม่ชัดพอ → ไม่นำมาตัดสิน และเริ่มนับใหม่
        if (!detection || detection.detection.score < MIN_DETECT_SCORE) {
          confirmName  = null;
          confirmCount = 0;
          return;
        }

        const { best, runnerUp } = findBestMatch(detection.descriptor);
        const passThreshold = best.distance < MATCH_THRESHOLD;
        const passMargin    = !runnerUp || (runnerUp.distance - best.distance) >= MATCH_MARGIN;

        if (passThreshold && passMargin) {
          // ต้องเป็นคนเดิมติดต่อกันครบ CONFIRM_FRAMES เฟรม จึงยืนยัน
          if (best.name === confirmName) {
            confirmCount++;
          } else {
            confirmName  = best.name;
            confirmCount = 1;
          }

          if (confirmCount >= CONFIRM_FRAMES) {
            stopScanLoop();
            document.getElementById('scanLine').classList.remove('active');
            showModal(best);
          } else {
            overlayStatus.innerText        = '🔎 กำลังยืนยันตัวตน ' + confirmCount + '/' + CONFIRM_FRAMES;
            overlayStatus.style.background = 'rgba(74,242,215,0.12)';
            overlayStatus.style.color      = '#4AF2D7';
            overlayStatus.style.border     = '1px solid rgba(74,242,215,0.5)';
          }
        } else {
          confirmName  = null;
          confirmCount = 0;
          if (passThreshold && !passMargin) {
            // ใกล้เคียงกัน 2 คนเกินไป — ไม่เดา ให้ขยับหน้าเข้าใกล้กล้อง
            overlayStatus.innerText        = 'ใบหน้ากำกวม กรุณาเข้าใกล้กล้องขึ้น';
            overlayStatus.style.background = 'rgba(251,191,36,0.12)';
            overlayStatus.style.color      = '#fbbf24';
            overlayStatus.style.border     = '1px solid rgba(251,191,36,0.5)';
          } else {
            overlayStatus.innerText        = 'ไม่รู้จัก (' + best.distance.toFixed(2) + ')';
            overlayStatus.style.background = 'rgba(255,107,107,0.12)';
            overlayStatus.style.color      = '#ff6b6b';
            overlayStatus.style.border     = '1px solid rgba(255,107,107,0.5)';
          }
        }
      } catch (error) {
        if (run === scanGeneration) cameraFailure('ตรวจใบหน้าไม่สำเร็จ: ' + error.message);
      } finally {
        if (isCurrent()) scanInterval = setTimeout(tick, 160);
      }
    };
    scanInterval = setTimeout(tick, 160);
  }

  // จับคู่แบบ "ระยะที่ดีที่สุดต่อคน" แล้วคืนทั้งอันดับ 1 และอันดับ 2 (คนละคนกัน)
  // เพื่อเช็กว่าอันดับ 1 ชนะขาดจริง ไม่ใช่เฉือนกันจนเสี่ยงจับผิดคน
  function findBestMatch(queryDesc) {
    const byName = {};
    knownFaces.forEach(u => {
      const d = faceapi.euclideanDistance(queryDesc, u.descriptor);
      if (byName[u.name] === undefined || d < byName[u.name]) byName[u.name] = d;
    });
    const ranked = Object.keys(byName)
      .map(n => ({ name: n, distance: byName[n] }))
      .sort((a, b) => a.distance - b.distance);
    return {
      best:     ranked[0] || { name: 'unknown', distance: 1.0 },
      runnerUp: ranked[1] || null
    };
  }

  function showModal(match) {
    camera.stop();
    AttendanceRecovery.record("face-matched");
    currentMatch = match.name;
    document.getElementById('modalName').innerText  = match.name;
    document.getElementById('noteInput').value = '';

    // บอกล่วงหน้าว่าครั้งนี้เป็นสแกนเข้าหรือออก (ตามข้อมูลวันนี้ที่โหลดล่าสุด)
    const actionEl = document.getElementById('modalAction');
    if (!todayStatusLoaded) {
      actionEl.innerText = 'ระบบจะตรวจสอบเข้า–ออกเมื่อบันทึก';
      actionEl.className = 'action-badge';
    } else if (checkedInToday[match.name]) {
      actionEl.innerText = '🟠 สแกนออกงาน';
      actionEl.className = 'action-badge out';
    } else {
      actionEl.innerText = '🟢 สแกนเข้างาน';
      actionEl.className = 'action-badge';
    }

    const now = new Date();
    const timeStr = now.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
    document.getElementById('modalTime').innerText  = 'เวลาที่สแกน: ' + timeStr + ' น.';

    const pct = ((1 - match.distance) * 100).toFixed(1);
    document.getElementById('modalScore').innerText = 'ความเหมือน: ' + pct + '%';

    confirmModal.style.display = 'flex';
    mainStatus.innerText = 'กรุณายืนยัน...';
    mainStatus.style.color = '#D1F7F2';
  }

  async function confirmAttendance() {
    if (savingAttendance || !currentMatch) return;
    savingAttendance = true;
    const btn = document.getElementById('btnConfirm');
    const note = document.getElementById('noteInput').value.trim();
    btn.disabled = true;
    btn.innerText = 'กำลังบันทึก...';
    try {
      const data = await AttendanceRecovery.send(fetch, API_URL, {
            action: 'logAttendance',
            site: APP_SITE,
            key: APP_KEY,
            name: currentMatch,
            lat: currentLat,
            lng: currentLng,
            note: note
        }, idempotentBackend);
      alert('✅ ' + (data.message || 'บันทึกเวลาสำเร็จ'));
      window.location.href = 'index.html';
    } catch (e) {
      alert('⚠️ ' + e.message + '\nหากยังไม่ยืนยันผล กรุณาตรวจตารางก่อนสแกนซ้ำ');
    } finally {
      savingAttendance = false;
      btn.disabled = false;
      btn.innerText = '✅ ยืนยันบันทึกเวลา';
    }
  }

  function cancelAttendance() {
    if (savingAttendance) return;
    confirmModal.style.display = 'none';
    currentMatch = null;
    confirmName  = null;
    confirmCount = 0;
    stopScanLoop();

    camera.stop();
    video.classList.remove('active');
    document.getElementById('scanLine').classList.remove('active');

    mainStatus.innerText    = '✅ ระบบพร้อมใช้งาน';
    mainStatus.style.color  = '#3DE0C6';
    overlayStatus.innerText = 'รอโหลด...';
    overlayStatus.style.background = 'rgba(6,21,29,0.85)';
    overlayStatus.style.color = '#D1F7F2';
    overlayStatus.style.border = '1px solid #144A46';
    btnStart.style.display  = 'inline-block';
  }

  function showError(msg) {
    AttendanceRecovery.showHelp(msg);
    mainStatus.textContent = '❌ ' + msg;
    mainStatus.style.color = '#ff6b6b';
    mainStatus.style.fontWeight = 'bold';
    overlayStatus.innerText = systemReady ? 'กรุณาเปิดกล้องใหม่' : 'ยังไม่พร้อมสแกน';
    btnStart.textContent = systemReady ? '📷 เปิดกล้องใหม่' : '↻ ลองเตรียมระบบใหม่';
    btnStart.onclick = systemReady ? startCamera : init;
    if (!API_URL) {
      btnStart.textContent = 'ตั้งค่าระบบ';
      btnStart.onclick = () => { location.href = 'config.html'; };
    }
    btnStart.disabled = false;
    btnStart.style.display = 'inline-block';
  }

  function haversineKm(lat1, lon1, lat2, lon2) {
    const R    = 6371;
    const dLat = deg2rad(lat2 - lat1);
    const dLon = deg2rad(lon2 - lon1);
    const a = Math.sin(dLat/2) ** 2 +
              Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) * Math.sin(dLon/2) ** 2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }

  function deg2rad(deg) { return deg * Math.PI / 180; }
</script>
